log_level: info
providers:
  kubernetes:
    enabled: true
    mode: controller
    controller_name: rakunlabs.com/turna
    controller_id: turna-conformance
    namespaces: []
    port_offset: 8000
    health_address: :9901
    status:
      leader_election:
        name: turna
    proxy:
      service_account: turna-proxy
      replicas: 1
      service_type: LoadBalancer
      image_pull_policy: Never
      log_level: info
      cpu_request: 10m
      memory_request: 32Mi
      memory_limit: 256Mi
