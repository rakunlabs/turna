{{- $namespaced := eq .Values.scope "namespace" -}}
{{- $readerKind := ternary "Role" "ClusterRole" $namespaced -}}
{{- $gatewayPlacement := eq (include "turna-gateway.gatewayPlacement" .) "true" -}}
{{- $proxyIdentity := eq (include "turna-gateway.proxyIdentity" .) "true" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turna-gateway.fullname" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
---
# read access to resources needed to translate gateways, used by the
# controller and the proxies; with scope namespace the GatewayClass read is
# granted by the cluster administrator
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $readerKind }}
metadata:
  name: {{ include "turna-gateway.fullname" . }}-reader
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: {{ ternary (list "services") (list "services" "namespaces") $namespaced | toJson }}
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: {{ concat (ternary (list) (list "gatewayclasses") $namespaced) (list "gateways" "listenersets" "httproutes" "grpcroutes" "tlsroutes" "tcproutes" "udproutes" "referencegrants" "backendtlspolicies") | toJson }}
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $readerKind }}
metadata:
  name: {{ include "turna-gateway.fullname" . }}-status
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
rules:
  # listener certificates and BackendTLSPolicy CA certificates; proxies get
  # them for their Gateway through a Secret in the release namespace
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: {{ concat (ternary (list) (list "gatewayclasses/status") $namespaced) (list "gateways/status" "listenersets/status" "httproutes/status" "grpcroutes/status" "tlsroutes/status" "tcproutes/status" "udproutes/status" "backendtlspolicies/status") | toJson }}
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $readerKind }}Binding
metadata:
  name: {{ include "turna-gateway.fullname" . }}-reader
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $readerKind }}
  name: {{ include "turna-gateway.fullname" . }}-reader
subjects:
  - kind: ServiceAccount
    name: {{ include "turna-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
  {{- if and (ne .Values.mode "standalone") (not $proxyIdentity) }}
  - kind: ServiceAccount
    name: {{ include "turna-gateway.proxyServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: {{ $readerKind }}Binding
metadata:
  name: {{ include "turna-gateway.fullname" . }}-status
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: {{ $readerKind }}
  name: {{ include "turna-gateway.fullname" . }}-status
subjects:
  - kind: ServiceAccount
    name: {{ include "turna-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turna-gateway.fullname" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  {{- if ne .Values.mode "standalone" }}
  # the controller reads its own pod for the proxy image
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  # proxy resources are created in the release namespace
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- if $proxyIdentity }}
  # each proxy gets a ServiceAccount and a Role reading only its certificate
  # Secret
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turna-gateway.fullname" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turna-gateway.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "turna-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- if $proxyIdentity }}
---
# the ServiceAccount of each proxy is bound to the reader ClusterRole; with
# placement gateway the proxies and their RBAC live in the Gateway namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "turna-gateway.fullname" . }}-proxy-identity
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterrolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles"]
    resourceNames: [{{ printf "%s-reader" (include "turna-gateway.fullname" .) | quote }}]
    verbs: ["bind"]
  {{- if $gatewayPlacement }}
  # proxies, their ServiceAccounts and RBAC are created in the namespace of
  # each Gateway
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["roles", "rolebindings"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "turna-gateway.fullname" . }}-proxy-identity
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "turna-gateway.fullname" . }}-proxy-identity
subjects:
  - kind: ServiceAccount
    name: {{ include "turna-gateway.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- if and (ne .Values.mode "standalone") (not $proxyIdentity) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "turna-gateway.proxyServiceAccount" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
---
# proxies read only the certificate bundles written by the controller
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "turna-gateway.proxyServiceAccount" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "turna-gateway.proxyServiceAccount" . }}
  labels:
    {{- include "turna-gateway.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "turna-gateway.proxyServiceAccount" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "turna-gateway.proxyServiceAccount" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
