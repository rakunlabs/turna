image:
  repository: ghcr.io/rakunlabs/turna
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# mode is "controller" (a proxy Deployment and Service per Gateway, the
# recommended mode) or "standalone" (this Deployment serves every Gateway on
# one shared Service).
mode: controller

# controllerName is matched with GatewayClass spec.controllerName.
controllerName: rakunlabs.com/turna

gatewayClass:
  # create a GatewayClass for this controller
  create: true
  name: turna

# watchNamespaces limits the watched namespaces, empty watches all.
watchNamespaces: []

# scope is "cluster" or "namespace". With "namespace" the release serves only
# Gateways in its own namespace and needs no cluster-wide permissions, so a
# namespace owner can install it. A cluster administrator must first create
# the GatewayClass named gatewayClass.name and grant read access to it, see
# deploy/examples/namespace-scoped-admin.yaml. gatewayClass.create must be
# false, watchNamespaces is ignored, allowedRoutes Selector namespaces match
# nothing and GatewayClass status is not written.
scope: cluster

# allowExternalNameBackends permits routes to use ExternalName Services as
# backends. They can point to any host, for example cloud metadata endpoints,
# so enable this only when every route author is trusted.
allowExternalNameBackends: false

# Gateway listener ports are bound inside the pods as port + portOffset so
# the containers run without NET_BIND_SERVICE.
portOffset: 8000

logLevel: info

# extraConfig is merged into the turna configuration file.
extraConfig: {}

# controller (or standalone proxy) replicas; only the leader writes status
# and provisions proxy resources.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# proxy configures the Deployment and Service created per Gateway in
# controller mode. Gateway spec.infrastructure labels are added to the pods
# and annotations to the Service. Proxies run the controller image. With more
# than one replica, each proxy gets a PodDisruptionBudget and its replicas are
# spread over nodes and zones.
proxy:
  # placement is "controller" (proxies in the release namespace) or "gateway"
  # (proxies in the Gateway namespace, so Gateway owners see their proxy).
  # With scope cluster every proxy gets its own ServiceAccount and a Role
  # reading only its certificate Secret, which needs cluster-wide write
  # access to ClusterRoleBindings; scope namespace shares one ServiceAccount.
  # "gateway" needs scope cluster and grants the controller cluster-wide write
  # access to proxy resources and RBAC bindings.
  placement: controller
  replicas: 2
  serviceType: LoadBalancer
  # addressesAnnotation is the Service annotation requesting the addresses of
  # Gateway spec.addresses, e.g. metallb.io/loadBalancerIPs; empty uses
  # spec.loadBalancerIP and supports one address
  addressesAnnotation: ""
  logLevel: info
  # a terminating proxy keeps serving while it is removed from load
  # balancers (preStop sleep, Kubernetes 1.30+); "-1s" disables it
  shutdownDelay: 5s
  resources:
    cpuRequest: 100m
    memoryRequest: 64Mi
    cpuLimit: ""
    memoryLimit: 256Mi

# standalone mode only: ports exposed by the shared Service. nodePort is
# optional for NodePort services. protocol defaults to TCP; set UDP for
# UDPRoute listeners (e.g. {name: dns-udp, port: 53, protocol: UDP}).
listenerPorts:
  - name: http
    port: 80
  - name: https
    port: 443

# standalone mode only
service:
  type: LoadBalancer
  annotations: {}
  externalTrafficPolicy: ""

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}

podDisruptionBudget:
  enabled: true
  minAvailable: 1
