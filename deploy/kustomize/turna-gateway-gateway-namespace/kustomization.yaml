apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Proxies are created in the namespace of each Gateway, with a ServiceAccount
# per Gateway bound to the turna-reader ClusterRole. Gateway owners see their
# proxy Deployment, Service and pods next to the Gateway.
resources:
  - ../turna-gateway
  - rbac.yaml

configMapGenerator:
  - name: turna-config
    behavior: replace
    files:
      - turna.yaml
