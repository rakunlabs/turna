apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace scoped installation for a namespace owner. A cluster administrator
# first applies deploy/examples/namespace-scoped-admin.yaml for the tenant.
# Set the tenant namespace in namespace-transformer.yaml and the GatewayClass
# in turna.yaml.
resources:
  - ../turna-gateway
  - rbac.yaml

transformers:
  - namespace-transformer.yaml

configMapGenerator:
  - name: turna-config
    behavior: replace
    files:
      - turna.yaml

# Cluster scoped resources of the base are created by the administrator or
# replaced by the Roles in rbac.yaml.
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: turna-system
  - patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: GatewayClass
      metadata:
        name: turna
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: turna-reader
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRole
      metadata:
        name: turna-status
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: turna-reader
  - patch: |-
      $patch: delete
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: turna-status
