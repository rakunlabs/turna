# Namespaced replacements of the base ClusterRoles. Reading the GatewayClass
# is granted by the cluster administrator.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna-reader
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "listenersets", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes", "referencegrants", "backendtlspolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna-reader
subjects:
  - kind: ServiceAccount
    name: turna
  - kind: ServiceAccount
    name: turna-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna-status
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways/status", "listenersets/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status", "tcproutes/status", "udproutes/status", "backendtlspolicies/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna-status
subjects:
  - kind: ServiceAccount
    name: turna
---
# Proxies share a ServiceAccount: per proxy ServiceAccounts need
# cluster-wide bindings. It reads only the certificate bundles written by the
# controller, which are the only Secrets the controller writes here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turna-proxy
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna-proxy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna-proxy
subjects:
  - kind: ServiceAccount
    name: turna-proxy
