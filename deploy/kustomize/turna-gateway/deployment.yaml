apiVersion: apps/v1
kind: Deployment
metadata:
  name: turna
  labels:
    app.kubernetes.io/name: turna-gateway
    app.kubernetes.io/instance: turna
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: turna-gateway
      app.kubernetes.io/instance: turna
  template:
    metadata:
      labels:
        app.kubernetes.io/name: turna-gateway
        app.kubernetes.io/instance: turna
    spec:
      serviceAccountName: turna
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: turna
          image: ghcr.io/rakunlabs/turna:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CONFIG_FILE
              value: /etc/turna/turna.yaml
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 9901
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ready
              port: health
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/turna
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: turna-config
