apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: turna-system

resources:
  - namespace.yaml
  - deployment.yaml
  - rbac.yaml
  - gatewayclass.yaml
  - pdb.yaml

# Pin a released tag or digest for production. Proxies use the image of the
# controller pod, so overlays changing it keep both in sync.
images:
  - name: ghcr.io/rakunlabs/turna
    newTag: latest
