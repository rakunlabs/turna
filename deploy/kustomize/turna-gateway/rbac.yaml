apiVersion: v1
kind: ServiceAccount
metadata:
  name: turna
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turna-proxy
---
# Both the controller and proxies need read access to Gateway API resources
# and their Service, EndpointSlice, Secret and Namespace references.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: turna-reader
rules:
  - apiGroups: [""]
    resources: ["services", "secrets", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes", "referencegrants"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turna-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: turna-reader
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
  - kind: ServiceAccount
    name: turna-proxy
    namespace: default
---
# Only the controller writes status and provisions proxy resources.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: turna-status
rules:
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status", "tcproutes/status", "udproutes/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turna-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: turna-status
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
