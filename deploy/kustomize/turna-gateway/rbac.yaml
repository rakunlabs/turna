apiVersion: v1
kind: ServiceAccount
metadata:
  name: turna
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: turna-proxy
---
# Both the controller and proxies need read access to Gateway API resources
# and their Service, EndpointSlice and Namespace references.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: turna-reader
rules:
  - apiGroups: [""]
    resources: ["services", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses", "gateways", "listenersets", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes", "referencegrants", "backendtlspolicies"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turna-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: turna-reader
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
  - kind: ServiceAccount
    name: turna-proxy
    namespace: default
---
# Only the controller writes status and reads listener and BackendTLSPolicy
# CA certificates. Proxies get them for their Gateway through a Secret in
# this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: turna-status
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gatewayclasses/status", "gateways/status", "listenersets/status", "httproutes/status", "grpcroutes/status", "tlsroutes/status", "tcproutes/status", "udproutes/status", "backendtlspolicies/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: turna-status
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: turna-status
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
---
# Proxy resources are created in this namespace. Set proxy.namespace only
# together with a copy of this Role and RoleBinding in that namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # the controller reads its own pod for the default proxy image
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna
subjects:
  - kind: ServiceAccount
    name: turna
    namespace: default
---
# Proxies read only the certificate bundles written by the controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: turna-proxy
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: turna-proxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: turna-proxy
subjects:
  - kind: ServiceAccount
    name: turna-proxy
    namespace: default
