log_level: info
providers:
  kubernetes:
    enabled: true
    mode: controller
    controller_name: rakunlabs.com/turna
    controller_id: turna-kustomize
    namespaces: []
    port_offset: 8000
    health_address: :9901
    status:
      leader_election:
        # Namespace defaults to POD_NAMESPACE, so namespace overlays work.
        name: turna
    proxy:
      # Namespace defaults to POD_NAMESPACE. The image defaults to the image
      # of the controller pod, set in kustomization.yaml. Every proxy gets
      # its own ServiceAccount bound to cluster_role and a Role reading only
      # its certificate Secret.
      cluster_role: turna-reader
      replicas: 2
      service_type: LoadBalancer
      log_level: info
      cpu_request: 100m
      memory_request: 64Mi
      memory_limit: 256Mi
