allowBuilds:
  '@scarf/scarf': false
  '@tree-sitter-grammars/tree-sitter-yaml': false
  core-js-pure: false
  tree-sitter: false
  tree-sitter-json: false

# swagger-ui 5.34 calls ReactDOM.createRoot from the default "react-dom"
# export, which React 19 no longer provides ("o is not a function").
overrides:
  react: ^18.3.1
  react-dom: ^18.3.1
