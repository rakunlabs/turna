loads:
  - name: server
    statics:
      - content:
          # name using to export value in map
          codec: "YAML"
          content: |
            entrypoints:
              web:
                address: ":8000"
          raw: false
          template: false
server:
  load_value: "server"
  http:
    middlewares:
      basic_auth:
        basic_auth:
          users:
            - "test:$2y$10$kcIcZZWz2YciwMVS9UYJaurYifLlMfzZ6WHL/SoDtTvENTQMi8ii2" # pass
            - "test2:$2a$10$I/eN703FenkCIzqvSZ2UbeJFm.ddiTNIyXoO1ku2fUKkjSIddAKKi" # pass
      myfolder:
        folder:
          # path: ./testdata/html
          # index: true
          # spa: true
          browse: true
          utc: true
      myservice:
        service:
          loadbalancer:
            servers:
              - url: "http://localhost:9090"
    routers:
      private:
        path: /pkg/server/*
        middlewares:
          - basic_auth
          - myfolder
      test:
        path: /*
        middlewares:
          - myfolder
